# Local demo: Postgres, Redis and the app (API + worker in one process, simulated Shopify store).
#   docker compose up --build    then open http://localhost:8080/demo/ and http://localhost:8080/dashboard/
# To use Claude on Vertex AI instead of offline agents:
#   gcloud auth application-default login
#   LLM_PROVIDER=vertex GCP_PROJECT=<project> docker compose up --build
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: popup, POSTGRES_PASSWORD: popup, POSTGRES_DB: popup }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "popup"], interval: 2s, retries: 30 }
  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8080:8080"]
    environment:
      ROLE: all
      DATABASE_URL: postgres://popup:popup@postgres:5432/popup
      REDIS_URL: redis://redis:6379
      SHOPIFY_MODE: mock
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      GCP_PROJECT: ${GCP_PROJECT:-}
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
    volumes:
      - ${HOME}/.config/gcloud:/gcloud:ro
